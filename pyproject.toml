[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyevmdd"
version = "0.1.dev1"
description = "EVMDD Library for Python"
readme = "README.rst"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [{ name = "Robert Mattmüller", email = "robert@robert-mattmueller.de" }]
keywords = ["evmdd", "decision diagrams"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/robertmattmueller/pyevmdd"

[project.scripts]
evmdd = "evmdd.cli:main"

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8", "ruff>=0.15"]
docs = [
    "sphinx>=8.1.3",
]

[tool.setuptools]
packages = ["evmdd"]

[tool.setuptools.package-data]
evmdd = ["py.typed"]

[tool.mypy]
files = ["evmdd"]
strict = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Names are imported to re-export them as the package API.
"evmdd/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["evmdd", "tests"]
addopts = "--doctest-modules"
